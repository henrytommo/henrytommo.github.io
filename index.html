<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            padding: 40px 20px;
        }

        /* Container to keep layout centered and neat */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Layout: Title on left, Tabs on top-right */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #111;
        }

        /* Top-Right Navigation Tabs */
        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        /* Hover and Active Visual States */
        nav a:hover {
            background-color: #eee;
            color: #111;
        }

        nav a.active {
            background-color: #0066cc;
            color: white;
        }

        /* Main Intro Content Styling */
        main h1 {
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 15px;
        }

        main p {
            font-size: 1.15rem;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header area with logo and top-right tabs -->
        <header>
            <div class="logo">hi</div>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="posts.html">Posts</a></li>
                </ul>
            </nav>
        </header>

        <!-- Main Introduction Content -->
        <main>
            <h1>hello</h1>
            <p>welcome</p>
        </main>
    </div>

</body>
</html>
